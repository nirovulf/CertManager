{% extends "base.html" %}

{% block title %}{{ 'Редактировать' if department else 'Добавить' }} подразделение{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">{{ 'Редактировать' if department else 'Добавить' }} подразделение</h1>
    <a href="{{ url_for('departments_list') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Назад
    </a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Название подразделения *</label>
                        <input type="text" class="form-control" id="name" name="name" 
                               value="{{ department.name if department else '' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="organization_id" class="form-label">Организация *</label>
                        <select class="form-select" id="organization_id" name="organization_id" required>
                            <option value="">Выберите организацию</option>
                            {% for org in organizations %}
                            <option value="{{ org.id }}" 
                                {% if department and department.organization_id == org.id %}selected{% endif %}>
                                {{ org.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Сохранить
                        </button>
                        <a href="{{ url_for('departments_list') }}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
